<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp de Limpieza</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <header class="app-header">
    <h1>Sharp de Limpieza</h1>
    <p>Calendario de ejecucion diaria con control de pendientes y realizadas.</p>
    <span id="sync-status" class="sync-status" data-state="busy">Conectando...</span>
  </header>

  <main class="layout">
    <section class="board-section">
      <div class="toolbar">
        <form id="collaborator-form">
          <label for="collaborator-name">Nuevo colaborador</label>
          <div class="input-row">
            <input id="collaborator-name" name="collaboratorName" type="text" maxlength="40" placeholder="Ej: Daniela" required>
            <button type="submit">Agregar</button>
          </div>
        </form>
      </div>

      <div class="table-wrap">
        <table id="schedule-table">
          <thead>
            <tr>
              <th class="header-colaboradores">Colaboradores</th>
              <th>Lunes</th>
              <th>Martes</th>
              <th>Miercoles</th>
              <th>Jueves</th>
              <th>Viernes</th>
              <th class="weekend">Sabado</th>
              <th class="weekend">Domingo</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal flotante -->
  <div id="cell-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <span class="modal-kicker">Tareas del dia</span>
          <strong id="modal-cell-label">-</strong>
        </div>
        <button type="button" id="modal-close-btn" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">

        <!-- Lista de tareas actuales -->
        <div id="modal-task-list" class="modal-task-list"></div>

        <!-- Formulario para agregar tarea -->
        <div class="modal-add-section">
          <strong class="modal-section-title">Agregar tareas</strong>
          <label class="modal-field">
            <span>Paso 1 — Equipo</span>
            <select id="task-team"></select>
          </label>
          <div class="modal-field">
            <span class="modal-field-label">Paso 2 — Selecciona las tareas</span>
            <div id="task-checklist" class="task-checklist">
              <p class="checklist-empty">Selecciona un equipo primero.</p>
            </div>
          </div>
          <button type="button" id="add-task-btn" disabled>+ Agregar seleccionadas</button>
        </div>

        <!-- Libre -->
        <label class="checkbox-row modal-free-row" for="task-free">
          <input id="task-free" type="checkbox">
          Colaborador libre (FREE — no trabaja este dia)
        </label>

      </div>
      <div class="modal-foot">
        <button type="button" id="clear-task" class="btn-danger">Limpiar todo</button>
        <button type="button" id="modal-cancel-btn" class="secondary">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
