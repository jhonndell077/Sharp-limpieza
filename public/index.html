<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp de Limpieza</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="app-header">
    <h1>Sharp de Limpieza</h1>
    <p>Calendario de ejecucion diaria con control de pendientes y realizadas.</p>
    <span id="sync-status" class="sync-status" data-state="busy">Conectando...</span>
  </header>

  <main class="layout">
    <section class="board-section">
      <div class="toolbar">
        <form id="collaborator-form">
          <label for="collaborator-name">Nuevo colaborador</label>
          <div class="input-row">
            <input id="collaborator-name" name="collaboratorName" type="text" maxlength="40" placeholder="Ej: Daniela" required>
            <button type="submit">Agregar</button>
          </div>
        </form>
        <button id="load-example" class="secondary" type="button">Cargar ejemplo</button>
      </div>

      <div class="table-wrap">
        <table id="schedule-table">
          <thead>
            <tr>
              <th class="header-colaboradores">Colaboradores</th>
              <th>Lunes</th>
              <th>Martes</th>
              <th>Miercoles</th>
              <th>Jueves</th>
              <th>Viernes</th>
              <th class="weekend">Sabado</th>
              <th class="weekend">Domingo</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal flotante para editar casilla -->
  <div id="cell-modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <span class="modal-kicker">Asignar tarea</span>
          <strong id="modal-cell-label">-</strong>
        </div>
        <button type="button" id="modal-close-btn" class="modal-close-btn">✕</button>
      </div>
      <form id="task-form">
        <div class="modal-body">
          <label class="modal-field">
            <span>Paso 1 — Equipo</span>
            <select id="task-team"></select>
          </label>
          <label class="modal-field">
            <span>Paso 2 — Tarea</span>
            <select id="task-item"></select>
          </label>
          <p id="task-frequency-hint" class="hint-text">Selecciona equipo y tarea para ver la frecuencia del sharp.</p>
          <label class="checkbox-row" for="task-free">
            <input id="task-free" type="checkbox">
            Colaborador libre (FREE — no trabaja)
          </label>
          <label class="checkbox-row" for="task-done">
            <input id="task-done" type="checkbox">
            Marcar como realizada
          </label>
        </div>
        <div class="modal-foot">
          <button type="button" id="clear-task" class="btn-danger">Limpiar casilla</button>
          <button type="button" id="modal-cancel-btn" class="secondary">Cancelar</button>
          <button type="submit">Guardar tarea</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
