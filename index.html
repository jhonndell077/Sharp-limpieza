<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp de Limpieza</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <section class="board-section">
      <div class="toolbar">
        <form id="collaborator-form">
          <label for="collaborator-name">Nuevo colaborador</label>
          <div class="input-row">
            <input id="collaborator-name" name="collaboratorName" type="text" maxlength="40" placeholder="Ej: Daniela" required>
            <button type="submit">Agregar</button>
          </div>
        </form>
        <button id="load-example" class="secondary" type="button">Cargar ejemplo</button>
      </div>

      <div class="table-wrap">
        <table id="schedule-table">
          <thead>
            <tr>
              <th class="header-colaboradores">Colaboradores</th>
              <th>Lunes</th>
              <th>Martes</th>
              <th>Miercoles</th>
              <th>Jueves</th>
              <th>Viernes</th>
              <th>Sabado</th>
              <th>Domingo</th>
            </tr>
          </thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="editor-backdrop" class="editor-backdrop" hidden>
    <section class="floating-editor-card" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <div class="floating-editor-head">
        <div>
          <span class="floating-editor-kicker">Editor de tareas</span>
          <strong id="editor-title">Editar casilla</strong>
          <p id="editor-subtitle"></p>
        </div>
        <button id="editor-close" type="button" class="editor-danger" aria-label="Cerrar editor">X</button>
      </div>

      <div class="floating-editor-body">
        <label class="floating-field" for="editor-team">
          <span>Equipo a trabajar</span>
          <select id="editor-team"></select>
        </label>

        <div class="floating-list-head">
          <strong>Tareas disponibles</strong>
        </div>

        <div id="editor-task-list" class="task-checklist"></div>
      </div>

      <div class="floating-editor-foot">
        <button id="editor-clear" type="button" class="editor-warning">LIMPIAR CASILLA</button>
        <button id="editor-cancel" type="button" class="editor-secondary">CANCELAR</button>
        <button id="editor-save" type="button" class="editor-save">GUARDAR CAMBIOS</button>
      </div>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
